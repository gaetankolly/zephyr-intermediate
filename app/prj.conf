CONFIG_LOG=y
CONFIG_THREAD_NAME=y

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_ZBUS=yes

# Hardware watchdog — last line of defence
CONFIG_WATCHDOG=y
# Per-thread software watchdog. Identifies WHICH thread is stuck
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y # use hardware WDT as backstop for task_wdt
